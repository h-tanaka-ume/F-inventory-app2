<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>かんたん在庫管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">INVENTORY CONTROL</p>
      <h1>かんたん在庫管理</h1>
      <p class="subtitle">ブラウザだけで使える、小規模チーム向け在庫管理</p>
    </div>
    <div class="header-actions">
      <button id="exportCsvBtn" class="button secondary">CSVエクスポート</button>
      <label class="button secondary file-button">CSVインポート<input id="importCsvInput" type="file" accept=".csv,text/csv"></label>
      <button id="clearAllBtn" class="button danger-outline">全商品を削除</button>
      <button id="resetBtn" class="button danger-outline">初期データに戻す</button>
      <span id="syncStatus" class="sync-status" aria-live="polite">ローカル保存</span>
    </div>
  </header>

  <main class="container">
    <section class="summary-grid" aria-label="在庫サマリー">
      <article class="summary-card"><span>登録商品数</span><strong id="totalProducts">0</strong><small>品目</small></article>
      <article class="summary-card"><span>在庫総数</span><strong id="totalQuantity">0</strong><small>個</small></article>
      <article class="summary-card warning"><span>要補充</span><strong id="lowStockCount">0</strong><small>品目</small></article>
      <article class="summary-card"><span>履歴件数</span><strong id="historyCount">0</strong><small>件</small></article>
    </section>

    <nav class="tabs" aria-label="メニュー">
      <button class="tab active" data-tab="inventory">在庫一覧</button>
      <button class="tab" data-tab="reorder">要補充一覧</button>
      <button class="tab" data-tab="transaction">入出庫フォーム</button>
      <button class="tab" data-tab="history">入出庫履歴</button>
    </nav>

    <section id="inventory" class="panel active-panel">
      <div class="panel-heading"><div><h2>在庫一覧</h2><p>品番、保管場所、現在庫、発注点を確認できます。</p></div><button id="addProductBtn" class="button primary">＋ 商品を追加</button></div>
      <div class="inventory-filters" aria-label="在庫一覧の検索・絞り込み">
        <input id="inventorySearch" class="search" type="search" placeholder="品番・品名・保管場所で検索">
        <select id="inventoryLocationFilter" class="filter-select" aria-label="保管場所で絞り込み">
          <option value="">保管場所：すべて</option>
        </select>
        <select id="inventoryStatusFilter" class="filter-select" aria-label="在庫状態で絞り込み">
          <option value="">在庫状態：すべて</option>
          <option value="ok">適正在庫</option>
          <option value="low">要補充</option>
          <option value="out">欠品</option>
        </select>
        <button id="clearInventoryFilters" class="button secondary" type="button">条件をクリア</button>
        <span id="inventoryResultCount" class="result-count"></span>
      </div>
      <div class="table-wrap"><table><thead><tr><th>品番</th><th>品名</th><th>保管場所</th><th>在庫数</th><th>発注点</th><th>状態</th><th>操作</th></tr></thead><tbody id="inventoryBody"></tbody></table></div>
    </section>

    <section id="reorder" class="panel">
      <div class="panel-heading"><div><h2>要補充一覧</h2><p>在庫数が発注点以下の商品を自動表示します。</p></div><span class="info-pill">在庫数 ≤ 発注点</span></div>
      <div class="table-wrap"><table><thead><tr><th>品番</th><th>品名</th><th>保管場所</th><th>在庫数</th><th>発注点</th><th>不足目安</th><th>操作</th></tr></thead><tbody id="reorderBody"></tbody></table></div>
    </section>

    <section id="transaction" class="panel">
      <div class="panel-heading"><div><h2>入出庫フォーム</h2><p>入庫・出庫を登録すると在庫と履歴が同時に更新されます。</p></div></div>
      <form id="transactionForm" class="form-card">
        <div class="form-grid">
          <label>商品<span class="required">*</span><select id="productSelect" required></select></label>
          <label>種別<span class="required">*</span><select id="transactionType" required><option value="入庫">入庫</option><option value="出庫">出庫</option></select></label>
          <label>数量<span class="required">*</span><input id="transactionQuantity" type="number" min="1" step="1" required placeholder="例：10"></label>
          <label>担当者<span class="required">*</span><input id="operator" required maxlength="50" placeholder="例：山田太郎"></label>
          <label class="full-width">メモ<textarea id="note" rows="3" maxlength="200" placeholder="仕入先、出庫先など（任意）"></textarea></label>
        </div>
        <div class="form-actions"><button type="reset" class="button secondary">クリア</button><button type="submit" class="button primary">入出庫を登録</button></div>
      </form>
      <div id="transactionMessage" class="message" role="status"></div>
    </section>

    <section id="history" class="panel">
      <div class="panel-heading"><div><h2>入出庫履歴</h2><p>新しい履歴から表示しています。</p></div></div>
      <div class="toolbar"><input id="historySearch" class="search" type="search" placeholder="品番・品名・担当者・メモで検索"><span id="historyResultCount" class="result-count"></span></div>
      <div class="table-wrap"><table><thead><tr><th>日時</th><th>品番</th><th>品名</th><th>種別</th><th>数量</th><th>担当者</th><th>メモ</th></tr></thead><tbody id="historyBody"></tbody></table></div>
    </section>
  </main>

  <dialog id="productDialog">
    <form id="productForm" method="dialog" class="dialog-card">
      <div class="dialog-heading"><h2 id="dialogTitle">商品を追加</h2><button type="button" id="closeDialogBtn" class="icon-button" aria-label="閉じる">×</button></div>
      <input id="editingProductId" type="hidden">
      <div class="code-settings">
        <div class="code-settings-heading">
          <strong>品番設定</strong>
          <label class="checkbox-label"><input id="autoCodeMode" type="checkbox" checked> 自動採番（読み取り専用）</label>
        </div>
        <div class="code-settings-grid">
          <label>接頭辞<input id="codePrefix" maxlength="10" value="ITEM" placeholder="例：ITEM"></label>
          <label>連番の桁数<select id="codeDigits"><option value="3">3桁（001）</option><option value="4" selected>4桁（0001）</option><option value="5">5桁（00001）</option><option value="6">6桁（000001）</option></select></label>
        </div>
      </div>
      <div class="form-grid">
        <label>品番<span class="required">*</span><input id="productCode" required maxlength="30" placeholder="自動生成されます" readonly></label>
        <label>品名<span class="required">*</span><input id="productName" required maxlength="100" placeholder="例：コピー用紙 A4"></label>
        <label>保管場所<span class="required">*</span><input id="storageLocation" required maxlength="100" placeholder="例：倉庫A 棚1"></label>
        <label>現在庫<span class="required">*</span><input id="productQuantity" type="number" min="0" step="1" required></label>
        <label>発注点<span class="required">*</span><input id="reorderPoint" type="number" min="0" step="1" required></label>
      </div>
      <div class="form-actions"><button type="button" id="cancelDialogBtn" class="button secondary">キャンセル</button><button type="submit" class="button primary">保存</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="alert"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
